<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact me about my Cyberpunk website.">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Contact Me</title>
</head>

<body>

<header>
    <nav>
        <ul>
            <li><a href="index.html"><span class="fa-solid fa-house" aria-hidden="true"></span>Home</a></li>
            <li><a href="characters.html"><span class="fa-solid fa-users" aria-hidden="true"></span>Characters</a></li>
            <li><a href="abouut.html"><span class="fa-solid fa-user" aria-hidden="true"></span>About Me</a></li>
            <li><a href="contact.html"><span class="fa-solid fa-envelope" aria-hidden="true"></span>Contact</a></li>
        </ul>
    </nav>
</header>

<main id="top">

    <h1>Contact Me</h1>

    <form action="" method="post">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="topic">Topic:</label>
        <select id="topic" name="topic">
            <option value="question">Question</option>
            <option value="feedback">Feedback</option>
            <option value="other">Other</option>
        </select>

        <br><br>

        <label for="message">Message:</label>
        <textarea id="message" name="message"></textarea>

        <br><br>

        <p>How do you like my website?</p>

        <input type="radio" id="good" name="rating" value="good">
        <label for="good">Good</label>

        <input type="radio" id="bad" name="rating" value="bad">
        <label for="bad">Bad</label>

        <br><br>

        <input type="checkbox" id="updates" name="updates">
        <label for="updates">I would like to see more content</label>

        <br><br>

        <button type="submit">Submit</button>

    </form>

</main>

<footer>
    <p>Cyberpunk Website</p>
    <p><a href="#top"><span class="fa-solid fa-arrow-up" aria-hidden="true"></span>Back to top</a></p>
</footer>

</body>
</html>
